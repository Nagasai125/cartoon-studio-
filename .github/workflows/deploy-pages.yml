name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/pipeline/src/cartoon_studio/domain/api_models.py"
      - "packages/pipeline/src/cartoon_studio/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      snapshot_steps:
        description: Simulated stages to advance before publishing the snapshot
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.2

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Verify dashboard
        run: npm run lint && npm run typecheck && npm run test

      - name: Generate public dashboard snapshot
        env:
          PYTHONPATH: packages/pipeline/src
          SNAPSHOT_STEPS: ${{ inputs.snapshot_steps || '0' }}
        run: >-
          uv run python -m cartoon_studio.workflows.export_snapshot
          --steps "$SNAPSHOT_STEPS"
          --output apps/dashboard/public/data/dashboard.json

      - name: Upload dashboard snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/dashboard/public/data/dashboard.json
          retention-days: 30

      - name: Build dashboard
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/dashboard/dist

  deploy:
    name: Deploy dashboard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
